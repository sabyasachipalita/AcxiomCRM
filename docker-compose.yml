version: '3.8'

services:
  acxiomcrm:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: acxiomcrm-app
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    volumes:
      - crm-data:/app/data
    restart: unless-stopped

volumes:
  crm-data:
